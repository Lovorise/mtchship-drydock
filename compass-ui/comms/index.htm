<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTCHSHIP Compass UI · CommsDock Host Harness</title>
  <style>
    :root {
      --bg: #fafafa;
      --p: #ffffff;
      --s: #f4f4f5;
      --b: #e4e4e7;
      --t: #09090b;
      --m: #71717a;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --p: #111114;
        --s: #18181c;
        --b: #27272a;
        --t: #fafafa;
        --m: #8e8e98;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--t); height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-size: 12.5px; }
    header { padding: 10px 16px; background: var(--p); border-bottom: 1px solid var(--b); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .04em; }
    .tag { font-size: 10.5px; padding: 2px 7px; border-radius: 4px; background: var(--s); border: 1px solid var(--b); color: var(--m); font-weight: 600; }
    .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    select, input, button { background: var(--p); color: var(--t); border: 1px solid var(--b); border-radius: 6px; padding: 5px 9px; font-size: 12px; outline: none; }
    button { cursor: pointer; font-weight: 600; }
    button.primary { background: var(--t); color: var(--p); border-color: var(--t); }
    .grid { flex: 1; display: grid; grid-template-columns: 1fr 390px; overflow: hidden; }
    .pane { display: flex; flex-direction: column; border-right: 1px solid var(--b); overflow: hidden; }
    .pane:last-child { border-right: 0; }
    .pane-hdr { padding: 6px 12px; background: var(--s); border-bottom: 1px solid var(--b); font-size: 11px; color: var(--m); display: flex; justify-content: space-between; }
    iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
    .wire-log { height: 110px; background: var(--p); border-top: 1px solid var(--b); padding: 8px 12px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 11px; color: var(--m); display: flex; flex-direction: column; gap: 3px; }
    .wire-log strong { color: var(--t); }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>MTCHSHIP</span>
      <span class="tag">CommsDock Host Harness · 0 bytes persistence</span>
    </div>
    <div class="controls">
      <label>Plan Tier:
        <select id="tierSel" onchange="pushHostConfig()">
          <option value="free">Free (API Locked)</option>
          <option value="starter">Starter (API Locked)</option>
          <option value="pro" selected>Edge Pro (Full API)</option>
          <option value="business">Business (Full API)</option>
          <option value="enterprise">Enterprise (Full API)</option>
        </select>
      </label>
      <label>Specialist Identity:
        <select id="idSel" onchange="pushHostConfig()">
          <option value="NAME_INITIALS" selected>NAME_INITIALS (Alex)</option>
          <option value="AGENT_PHOTO">AGENT_PHOTO (Host URL)</option>
          <option value="COMPANY_LOGO">COMPANY_LOGO (Brand Mask)</option>
        </select>
      </label>
      <input id="agentNameIn" value="Alex" style="width:90px" onchange="pushHostConfig()" title="Specialist Name or Digits" />
      <button class="primary" onclick="pushHostConfig()">Sync Host Config</button>
    </div>
  </header>

  <div class="grid">
    <div class="pane">
      <div class="pane-hdr"><span>AGENTDOCK · SPECIALIST WORKSPACE</span><span>agent/index.html</span></div>
      <iframe id="agentFrame" src="./agent/index.html"></iframe>
    </div>
    <div class="pane">
      <div class="pane-hdr"><span>CUSTOMER WIDGET · IN-APP STREAM</span><span>customer/index.html</span></div>
      <iframe id="customerFrame" src="./customer/index.html"></iframe>
    </div>
  </div>

  <div class="wire-log" id="wireLog">
    <div><strong>[CommsDock]</strong> Ready. Bridging frames between AgentDock and Customer Widget.</div>
  </div>

  <script>
    const agentFrame = document.getElementById('agentFrame');
    const customerFrame = document.getElementById('customerFrame');
    const wireLog = document.getElementById('wireLog');

    function logWire(direction, frame) {
      const row = document.createElement('div');
      row.innerHTML = `<strong>[${direction}]</strong> ${frame.type} · ticket #${frame.ticketId} ${frame.payload ? JSON.stringify(frame.payload) : ''}`;
      wireLog.prepend(row);
    }

    function pushHostConfig() {
      const config = {
        tier: document.getElementById('tierSel').value,
        active: true,
        brand: {
          name: 'MTCHSHIP',
          supportTitle: 'Support',
          logoUrl: '',
          accentColor: '#09090b',
          accentTextColor: '#ffffff'
        },
        assistant: {
          name: 'Steward Deck',
          subtitle: 'Helping you 24/7'
        },
        agentIdentity: {
          defaultMode: document.getElementById('idSel').value,
          displayName: document.getElementById('agentNameIn').value.trim() || 'Alex',
          avatarUrl: ''
        }
      };

      [agentFrame, customerFrame].forEach(f => {
        f.contentWindow?.postMessage({ target: 'CommsDock', config }, '*');
      });
    }

    // Deterministic bridge between AgentDock and Customer Widget
    window.addEventListener('message', ev => {
      const msg = ev.data;
      if (!msg || msg.source !== 'CommsDock' || !msg.frame) return;

      logWire(msg.surface.toUpperCase(), msg.frame);

      if (msg.surface === 'agent') {
        const forwarded = msg.frame.type === 'UI_SPOTLIGHT_INTENT'
          ? { ...msg.frame, type: 'UI_SPOTLIGHT' }
          : msg.frame;
        customerFrame.contentWindow?.postMessage({ target: 'CommsDock', frame: forwarded }, '*');
      } else if (msg.surface === 'customer') {
        agentFrame.contentWindow?.postMessage({ target: 'CommsDock', frame: msg.frame }, '*');
      }
    });

    agentFrame.addEventListener('load', pushHostConfig);
    customerFrame.addEventListener('load', pushHostConfig);
  </script>
</body>
</html>
