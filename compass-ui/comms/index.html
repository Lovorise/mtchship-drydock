<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTCHSHIP Compass UI · Host Environment</title>
  <style>
    :root {
      --bg: #fafafa;
      --p: #ffffff;
      --s: #f4f4f5;
      --b: #e4e4e7;
      --t: #09090b;
      --m: #71717a;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --p: #111114;
        --s: #18181c;
        --b: #27272a;
        --t: #fafafa;
        --m: #8e8e98;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--t); height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-size: 12.5px; }
    header { padding: 10px 16px; background: var(--p); border-bottom: 1px solid var(--b); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .04em; }
    .tag { font-size: 10.5px; padding: 2px 7px; border-radius: 4px; background: var(--s); border: 1px solid var(--b); color: var(--m); font-weight: 600; }
    .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    select, input, button { background: var(--p); color: var(--t); border: 1px solid var(--b); border-radius: 6px; padding: 5px 9px; font-size: 12px; outline: none; }
    button { cursor: pointer; font-weight: 600; }
    button.primary { background: var(--t); color: var(--p); border-color: var(--t); }

    /* Host App Target Bar for UI_SPOTLIGHT */
    .host-bar { padding: 8px 16px; background: var(--s); border-bottom: 1px solid var(--b); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .host-targets { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .spotlight-ring { outline: 2px solid var(--t); outline-offset: 3px; box-shadow: 0 0 0 6px rgba(113,113,122,.22); position: relative; }
    .spot-tooltip { display: none; position: fixed; top: 96px; left: 50%; transform: translateX(-50%); background: var(--t); color: var(--p); padding: 7px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; z-index: 90; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,.22); }
    .spot-tooltip.open { display: flex; }

    .grid { flex: 1; display: grid; grid-template-columns: 1fr 390px; overflow: hidden; }
    .pane { display: flex; flex-direction: column; border-right: 1px solid var(--b); overflow: hidden; }
    .pane:last-child { border-right: 0; }
    .pane-hdr { padding: 6px 12px; background: var(--s); border-bottom: 1px solid var(--b); font-size: 11px; color: var(--m); display: flex; justify-content: space-between; }
    iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
    .wire-log { height: 108px; background: var(--p); border-top: 1px solid var(--b); padding: 8px 12px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 11px; color: var(--m); display: flex; flex-direction: column; gap: 3px; }
    .wire-log strong { color: var(--t); }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>MTCHSHIP</span>
      <span class="tag">Host Environment · 0 bytes persistence</span>
    </div>
    <div class="controls">
      <label>Plan Tier:
        <select id="tierSel" onchange="pushHostConfig()">
          <option value="free">Free (API Locked)</option>
          <option value="starter">Starter (API Locked)</option>
          <option value="pro" selected>Edge Pro (Full API)</option>
          <option value="business">Business (Full API)</option>
          <option value="enterprise">Enterprise (Full API)</option>
        </select>
      </label>
      <label>Identity:
        <select id="idSel" onchange="pushHostConfig()">
          <option value="NAME_INITIALS" selected>NAME_INITIALS</option>
          <option value="AGENT_PHOTO">AGENT_PHOTO</option>
          <option value="COMPANY_LOGO">COMPANY_LOGO</option>
        </select>
      </label>
      <input id="agentNameIn" value="Alex" style="width:86px" onchange="pushHostConfig()" title="Specialist Name or Digits" />
      <button class="primary" onclick="pushHostConfig()">Sync Config</button>
    </div>
  </header>

  <!-- Simulated Host App Elements for UI_SPOTLIGHT -->
  <div class="host-bar">
    <span style="font-size:11px;color:var(--m)">Host App Targets (<code>UI_SPOTLIGHT</code>):</span>
    <div class="host-targets">
      <button id="checkout-confirm-btn" onclick="clearHostSpotlight()">#checkout-confirm-btn</button>
      <button id="billing-vat-input" onclick="clearHostSpotlight()">#billing-vat-input</button>
      <button id="workspace-invite-btn" onclick="clearHostSpotlight()">#workspace-invite-btn</button>
    </div>
  </div>

  <div class="spot-tooltip" id="spotTooltip">
    <span id="spotTooltipText">Host Element Highlighted</span>
    <button style="background:var(--p);color:var(--t);padding:2px 8px" onclick="clearHostSpotlight()">Dismiss</button>
  </div>

  <div class="grid">
    <div class="pane">
      <div class="pane-hdr"><span>AGENTDOCK · SPECIALIST WORKSPACE</span><span>agent/index.html</span></div>
      <iframe id="agentFrame" src="./agent/index.html"></iframe>
    </div>
    <div class="pane">
      <div class="pane-hdr"><span>CUSTOMER WIDGET · IN-APP STREAM</span><span>customer/index.html</span></div>
      <iframe id="customerFrame" src="./customer/index.html"></iframe>
    </div>
  </div>

  <div class="wire-log" id="wireLog">
    <div><strong>[CommsDock]</strong> Host ready. Routing wire frames between AgentDock and Customer Widget.</div>
  </div>

  <script>
    const agentFrame = document.getElementById('agentFrame');
    const customerFrame = document.getElementById('customerFrame');
    const wireLog = document.getElementById('wireLog');
    const spotTooltip = document.getElementById('spotTooltip');
    const spotTooltipText = document.getElementById('spotTooltipText');

    function logWire(direction, frame) {
      const row = document.createElement('div');
      row.innerHTML = `<strong>[${direction}]</strong> ${frame.type} · ticket #${frame.ticketId} ${frame.payload ? JSON.stringify(frame.payload) : ''}`;
      wireLog.prepend(row);
    }

    function clearHostSpotlight() {
      document.querySelectorAll('.spotlight-ring').forEach(el => el.classList.remove('spotlight-ring'));
      spotTooltip.classList.remove('open');
    }

    function triggerHostSpotlight(selector, hint) {
      clearHostSpotlight();
      const target = selector ? document.querySelector(selector) : null;
      if (target) target.classList.add('spotlight-ring');
      spotTooltipText.textContent = `${hint || 'Action required'} (${selector || 'host'})`;
      spotTooltip.classList.add('open');
    }

    function pushHostConfig() {
      const config = {
        tier: document.getElementById('tierSel').value,
        active: true,
        brand: {
          name: 'MTCHSHIP',
          supportTitle: 'Support',
          logoUrl: '',
          accentColor: '#09090b',
          accentTextColor: '#ffffff'
        },
        assistant: {
          name: 'Steward Deck',
          subtitle: 'Helping you 24/7'
        },
        agentIdentity: {
          defaultMode: document.getElementById('idSel').value,
          displayName: document.getElementById('agentNameIn').value.trim() || 'Alex',
          avatarUrl: null
        }
      };

      [agentFrame, customerFrame].forEach(f => {
        f.contentWindow?.postMessage({ target: 'CommsDock', config }, '*');
      });
    }

    window.addEventListener('message', ev => {
      const msg = ev.data;
      if (!msg || msg.source !== 'CommsDock' || !msg.frame) return;

      const frame = msg.frame;
      logWire(msg.surface.toUpperCase(), frame);

      if (msg.surface === 'agent') {
        if (frame.type === 'UI_SPOTLIGHT_INTENT') {
          triggerHostSpotlight(frame.payload?.selector, frame.payload?.hint);
          const spotlightFrame = { ...frame, type: 'UI_SPOTLIGHT' };
          customerFrame.contentWindow?.postMessage({ target: 'CommsDock', frame: spotlightFrame }, '*');
          return;
        }

        if (frame.type === 'WORKER_DELEGATE') {
          setTimeout(() => {
            const draftFrame = {
              type: 'WORKER_DRAFT_READY',
              ticketId: frame.ticketId,
              timestamp: Date.now(),
              sender: { role: 'AI_WORKER', displayName: 'Steward Worker', avatarMode: 'COMPANY_LOGO' },
              payload: { draft: `Prepared response for "${frame.payload?.task || 'request'}".` }
            };
            logWire('HOST->AGENT', draftFrame);
            agentFrame.contentWindow?.postMessage({ target: 'CommsDock', frame: draftFrame }, '*');
          }, 500);
          return;
        }

        customerFrame.contentWindow?.postMessage({ target: 'CommsDock', frame }, '*');
      } else if (msg.surface === 'customer') {
        if (frame.type === 'CALL_INTENT' && frame.payload?.action === 'START') {
          const ringFrame = {
            ...frame,
            payload: { ...frame.payload, action: 'RING', department: 'Front-Line' }
          };
          agentFrame.contentWindow?.postMessage({ target: 'CommsDock', frame: ringFrame }, '*');
          return;
        }

        agentFrame.contentWindow?.postMessage({ target: 'CommsDock', frame }, '*');
      }
    });

    agentFrame.addEventListener('load', pushHostConfig);
    customerFrame.addEventListener('load', pushHostConfig);
  </script>
</body>
</html>
