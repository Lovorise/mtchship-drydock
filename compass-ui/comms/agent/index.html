<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Comms Workspace</title>
  <link rel="stylesheet" href="agent.css" />
</head>
<body>
  <div class="ring-toast" id="inToast">
    <span class="dot" style="background:var(--ok)"></span>
    <div>
      <strong id="inCaller" style="font-size:12px">Customer</strong>
      <div style="font-size:10.5px;color:var(--m)" id="inDept">Incoming Secure Call</div>
    </div>
    <button class="btn" style="background:var(--ok);color:#000" onclick="acceptInCall()">Answer</button>
    <button class="btn" style="background:var(--e)" onclick="declineInCall()">✕</button>
  </div>

  <aside class="col">
    <div class="bar">
      <button class="pill" onclick="togglePop('deptP')"><strong id="dLbl">Front-Line</strong> <span style="color:var(--m)">▾</span></button>
      <div style="display:flex;gap:4px">
        <button class="pill" onclick="togglePop('stP')"><span class="dot" id="stDot" style="background:var(--ok)"></span><span id="stTxt">Online</span></button>
        <button class="pill" title="Simulate incoming chat" onclick="simChat()">+ Chat</button>
        <button class="pill" title="Simulate incoming call" onclick="simCall()">+ Call</button>
      </div>

      <div class="pop" id="deptP" style="left:12px"></div>
      <div class="pop" id="stP" style="right:12px">
        <button class="opt" onclick="setPresence('Online','#22c55e',true)"><span class="dot" style="background:#22c55e"></span>Online (Live)</button>
        <button class="opt" onclick="setPresence('In a Meeting','#ef4444',false)"><span class="dot" style="background:#ef4444"></span>In a Meeting</button>
        <button class="opt" onclick="setPresence('Away / Break','#f59e0b',false)"><span class="dot" style="background:#f59e0b"></span>Away / Break</button>
        <button class="opt" onclick="setPresence('Offline','#71717a',false)"><span class="dot" style="background:#71717a"></span>Offline</button>
      </div>
    </div>

    <div class="bnr"><span id="aiBnr">Live Agent Active</span><strong style="color:var(--a);font-size:10px">24/7</strong></div>
    <div class="mq" id="mqWrap" style="display:none"></div>

    <div style="padding:8px 10px;border-bottom:1px solid var(--b)">
      <input class="in" id="qIn" placeholder="Search customer, label, or #ID..." oninput="rList()" />
      <div class="tabs" id="tabs"></div>
      <div class="lbar" id="lFilter"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <section class="col">
    <div class="call-bnr" id="cBnr" onclick="ov.classList.add('open')">
      <span>● Secure call active · <strong id="bnrT">00:00</strong></span>
      <span style="color:var(--ok);font-weight:600">Return →</span>
    </div>
    <div class="bar">
      <div style="display:flex;align-items:center;gap:7px">
        <button class="pill" id="bk" style="display:none" onclick="document.body.classList.remove('chat')">←</button>
        <div>
          <strong id="cN"></strong> <span class="bdg" id="cD"></span>
          <div style="font-size:11px;color:var(--m);display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:2px" id="cS"></div>
        </div>
      </div>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="pill" onclick="togglePop('tktStP')"><span class="dot" id="tktStDot"></span><span id="tktStLbl">Open</span> ▾</button>
        <button class="pill" onclick="togglePop('lblP')">Labels</button>
        <button class="pill" onclick="togglePop('xP')">Transfer</button>
        <button class="btn" onclick="oCall()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Call</button>
      </div>

      <div class="pop" id="tktStP" style="right:140px;width:170px"></div>
      <div class="pop" id="lblP" style="right:12px;width:240px">
        <div style="font-size:10px;color:var(--m);font-weight:700;text-transform:uppercase">Custom Labels</div>
        <div id="lblList" style="display:flex;flex-wrap:wrap;gap:4px"></div>
        <form style="display:flex;gap:4px;align-items:center" onsubmit="saveCustomLbl(event)">
          <input type="color" id="newCol" value="#22c55e" style="width:28px;height:26px;border:0;background:0;cursor:pointer" />
          <input class="in" id="newLbl" placeholder="New label..." />
          <button class="btn">+</button>
        </form>
      </div>
      <div class="pop" id="xP" style="right:12px">
        <div style="font-size:10px;color:var(--m);font-weight:700;text-transform:uppercase">Transfer to Department</div>
        <div id="xList"></div>
        <input class="in" id="xN" placeholder="Internal whisper note..." />
      </div>
    </div>

    <div id="clm" style="display:none;padding:7px 14px;background:var(--s);border-bottom:1px solid var(--b);justify-content:space-between;align-items:center">
      <span>Unassigned in team queue</span><button class="btn" onclick="claim()">Claim Ticket</button>
    </div>
    <div class="stream" id="strm"></div>
    <div class="comp">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap">
        <div style="display:flex;gap:4px;flex-wrap:wrap" id="actRow"></div>
        <button class="pill" id="wBtn" style="padding:2px 9px;font-size:11px" onclick="toggleWhisper()">Whisper</button>
      </div>
      <form class="cbox" id="cForm" onsubmit="send(event)">
        <input id="mIn" placeholder="Write a helpful reply..." autocomplete="off" />
        <button class="btn" id="sBtn">Send</button>
      </form>
    </div>
  </section>

  <div class="ov" id="ov">
    <div class="ov-top">
      <button class="ov-bk" onclick="minCall()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <span style="display:flex;align-items:center;gap:5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z"/></svg>Secure call</span>
      <span style="width:32px"></span>
    </div>
    <div style="text-align:center">
      <div class="ring" id="ovMono">C</div>
      <h2 style="font-size:20px;font-weight:700" id="ovN"></h2>
      <p style="color:var(--m);font-size:13.5px;margin-top:6px" id="ovT">00:00</p>
    </div>
    <div class="ctrls">
      <button class="cbtn" onclick="this.classList.toggle('on')" title="Mute"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button>
      <button class="cbtn" onclick="this.classList.toggle('on')" title="Speaker"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
      <button class="cbtn" onclick="minCall()" title="Chat"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2z"/></svg></button>
      <button class="cbtn end" onclick="cCall()" title="End Call"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
  </div>

  <script src="agent-core.js"></script>
  <script src="agent-call.js"></script>
</body>
</html>
