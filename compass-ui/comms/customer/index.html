<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support</title>
  <link rel="stylesheet" href="customer.css" />
</head>
<body>
  <div class="ring-toast" id="inCallToast">
    <span class="dot" style="background:var(--ok)"></span>
    <div>
      <strong id="inCallName" style="font-size:12px">Support</strong>
      <div style="font-size:10.5px;color:var(--m)">Incoming secure call</div>
    </div>
    <button class="btn-ok" onclick="acceptCall()">Answer</button>
    <button class="btn-no" onclick="declineCall()">✕</button>
  </div>

  <div class="spot-bar" id="spotBar" style="display:none">
    <div>
      <strong style="font-size:11.5px">✦ Guided Highlight</strong>
      <div style="font-size:11px;color:var(--m)" id="spotText"></div>
    </div>
    <button class="pill-sm" onclick="dismissSpotlight()">Done</button>
  </div>

  <main class="shell">
    <div class="call-bar" id="activeCallBar" onclick="callOv.classList.add('open')">
      <span>● Secure call · <strong id="miniTimer">00:00</strong></span>
      <span style="font-weight:600">Return →</span>
    </div>

    <header class="top-bar">
      <button class="icon-btn" onclick="dock.emit({ type: 'TICKET_STATE', ticketId, timestamp: Date.now(), payload: { minimized: true } })" aria-label="Back">←</button>
      <div class="top-center">
        <strong id="hdrTitle">Support</strong>
        <span id="hdrSub">Helping you 24/7</span>
      </div>
      <div style="position:relative">
        <button class="icon-btn" id="menuBtn" onclick="morePop.classList.toggle('open')" aria-label="More">•••</button>
        <div class="pop" id="morePop">
          <button class="opt" id="startCallOpt" onclick="morePop.classList.remove('open');startVoiceCall()">Start in-app voice call</button>
          <button class="opt" id="humanOpt" onclick="morePop.classList.remove('open');requestHuman()">Talk to a live specialist</button>
        </div>
      </div>
    </header>

    <div class="stream" id="chatStream" onscroll="toggleScrollBtn()"></div>

    <button class="scroll-btn" id="scrollBtn" style="display:none" onclick="scrollToBottom()" aria-label="Scroll down">↓</button>

    <footer class="composer">
      <div class="pop att-pop" id="attPop">
        <label class="opt"><span>Send photo</span><input type="file" accept="image/*" hidden onchange="sendAttachment(this,'image')" /></label>
        <label class="opt"><span>Send document</span><input type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.csv" hidden onchange="sendAttachment(this,'doc')" /></label>
      </div>
      <form class="pill-box" onsubmit="sendMessage(event)">
        <input id="msgInput" placeholder="Type a message..." autocomplete="off" />
        <button type="button" class="clip-btn" id="clipBtn" onclick="attPop.classList.toggle('open')" aria-label="Attach">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
      </form>
    </footer>
  </main>

  <div class="modal" id="passkeyModal">
    <div class="modal-card">
      <strong>Host Passkey Sign-Off</strong>
      <p style="font-size:12px;color:var(--m);line-height:1.45" id="passkeyDesc">Confirm this request using your host app biometric or passkey check.</p>
      <div style="display:flex;gap:6px;justify-content:flex-end">
        <button type="button" class="pill-sm" onclick="cancelPasskey()">Cancel</button>
        <button type="button" class="btn-primary" onclick="confirmPasskey()">Verify & Submit</button>
      </div>
    </div>
  </div>

  <div class="ov" id="callOv">
    <div class="ov-top">
      <button class="icon-btn" onclick="minimizeCall()" aria-label="Minimize">←</button>
      <span class="sec-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z"/></svg>
        Secure call
      </span>
      <span style="width:28px"></span>
    </div>

    <div class="ov-mid">
      <div class="call-ring" id="callAvatar">S</div>
      <h2 class="call-name" id="callName">Support</h2>
      <div class="call-role" id="callRole">Support specialist</div>
      <div class="call-time" id="callTimer">00:00</div>
    </div>

    <div class="ctrls">
      <button class="cbtn" onclick="this.classList.toggle('on')" aria-label="Mute">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      </button>
      <button class="cbtn" onclick="this.classList.toggle('on')" aria-label="Speaker">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </button>
      <button class="cbtn" onclick="minimizeCall()" aria-label="Chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="cbtn end" onclick="hangupCall()" aria-label="End call">✕</button>
    </div>
  </div>

  <script src="../comms-dock.js"></script>
  <script src="customer.js"></script>
</body>
</html>
