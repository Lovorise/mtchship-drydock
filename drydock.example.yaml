# MTCHSHIP Drydock Configuration (100% Air-Gapped Localhost Runtime)
# Entity: Lovorise Ltd (UK Company No. 15814939) · License: Apache-2.0

network:
  data_plane_bind: "127.0.0.1:8443"
  control_api_bind: "127.0.0.1:9090"
  failover_target_ms: 50

runtime:
  air_gapped: true
  persistent_disk_bytes: 0
  disable_swap: true
  mlockall: true
  zero_pattern: "0x00"

simulation:
  default_tier: "enterprise"   # free | pro | business | enterprise
  region: "Europe"
  city: "London"

harbor_api:
  enabled: true
  modules:
    - "match_centre"
    - "match_ticker"
    - "story_news_feed"
    - "live_support"
    - "chat_rtc"
    - "forms"
    - "edge_state"

endpoints:
  primary_origin: "http://127.0.0.1:18080"
  backup_origin: "http://127.0.0.1:18081"
  object_storage_backup: "http://127.0.0.1:19000"
  dual_failure_countdown_sec: 5

standalone_addons:
  gpu_forge_harbor:
    enabled: false
    bandwidth_gbps: 10         # 10 | 20 | 40
  stream_harbor:
    enabled: false
    bandwidth_gbps: 10         # 10 | 20 | 40
  sealed_hold:
    enabled: false
    ddr5_ram_gb: 192           # 192 | 384 | 768
    enclave_mode: "AMD SEV-SNP / Intel TDX"
