name: Drydock CI & Air-Gapped Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Verify Go Dependencies
        run: go mod tidy

      - name: Run Unit & Race Tests
        run: go test -race -v ./...

      - name: Build Drydock Binary (with Embedded Dashboard)
        run: go build -o drydock ./cmd/drydock

      - name: Run Air-Gapped End-to-End Verification
        run: |
          ./drydock up --config drydock.example.yaml &
          DRYDOCK_PID=$!
          trap "kill -INT $DRYDOCK_PID 2>/dev/null || true" EXIT

          sleep 1

          DATA_URL="http://127.0.0.1:8443"
          CTRL_URL="http://127.0.0.1:9090"

          # 1. Verify Data Plane (127.0.0.1:8443)
          curl -sf "$DATA_URL" | grep -q '"persistent_disk_bytes":0'

          # 2. Verify Embedded Control Plane Dashboard UI (127.0.0.1:9090)
          curl -sf "$CTRL_URL" | grep -q "MTCHSHIP / Local Control Plane"

          # 3. Verify Tier Switch (POST /api/v1/tier)
          curl -sf -X POST "$CTRL_URL/api/v1/tier" \
            -H "Content-Type: application/json" \
            -d '{"tier":"business"}' | grep -q '"active_tier":"business"'

          # 4. Verify Deterministic 0x00 RAM Scrub (POST /api/v1/scrub)
          curl -sf -X POST "$CTRL_URL/api/v1/scrub" | grep -q '"scrubbed":"0x00"'

          # 5. Verify Metrics & Cutover Manifest Export
          curl -sf "$CTRL_URL/api/v1/metrics" | grep -q '"air_gapped":true'
          curl -sf "$CTRL_URL/api/v1/promote" | grep -q '"third_party_proxying":false'

          echo "All Drydock UI & API checks passed!"
